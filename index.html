<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="VacFamily — Gestão familiar e acompanhamento vacinal com foco em acessibilidade" />
    <meta name="theme-color" content="#01696f" />
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>VacFamily</title>
  </head>
  <body>
    <!--
      Filtros SVG para CORREÇÃO de daltonismo (ocultos).
      Objetivo: compensar a deficiência para tornar a interface mais
      confortável — NÃO simular como o daltônico enxerga.

      Estratégia:
        - Deuteranopia / Protanopia: rotação de matiz + boost de saturação
          nos canais que o usuário consegue distinguir melhor (azul/amarelo).
          A matriz amplifica diferenças percebidas sem distorcer demais.
        - Tritanopia: reforça canal vermelho/verde (preservados) e atenua
          a confusão azul/verde.
        - Acromatopsia: converte para tons de cinza de alto contraste,
          removendo dependência de cor para transmitir informação.
    -->
    <svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">

      <!-- DEUTERANOPIA — compensa dificuldade verde/vermelho -->
      <!-- Desloca percepção para eixo azul-amarelo que o usuário distingue bem -->
      <filter id="cb-deuteranopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="
           1.0   0.0  -0.05  0  0.02
           0.0   0.9   0.15  0  0.0
           0.0   0.1   0.95  0  0.0
           0     0     0     1  0
        "/>
      </filter>

      <!-- PROTANOPIA — compensa dificuldade vermelho (canal L ausente) -->
      <!-- Amplifica vermelho usando sinal do canal verde (que o usuário preserva) -->
      <filter id="cb-protanopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="
           0.85  0.20  -0.05  0  0.02
           0.10  0.90   0.0   0  0.0
          -0.05  0.10   0.95  0  0.0
           0     0      0     1  0
        "/>
      </filter>

      <!-- TRITANOPIA — compensa dificuldade azul/amarelo -->
      <!-- Reforça canal vermelho/verde, reduz confusão azul-verde -->
      <filter id="cb-tritanopia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="
           0.95  0.05   0.0   0  0.0
           0.0   0.88   0.12  0  0.0
           0.0  -0.18   1.18  0  0.0
           0     0      0     1  0
        "/>
      </filter>

      <!-- ACROMATOPSIA — escala de cinza perceptualmente uniforme (pesos ITU-R BT.709) -->
      <!-- Garante que toda informação transmitida por cor funcione por contraste de luminância -->
      <filter id="cb-acromatopsia" color-interpolation-filters="linearRGB">
        <feColorMatrix type="matrix" values="
          0.2126 0.7152 0.0722 0 0
          0.2126 0.7152 0.0722 0 0
          0.2126 0.7152 0.0722 0 0
          0      0      0      1 0
        "/>
      </filter>

    </svg>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
